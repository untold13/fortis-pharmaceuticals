<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        let language = "en",
          theme = "light";
        try {
          language =
            localStorage.getItem("fortis-language") === "ka" ? "ka" : "en";
          theme =
            localStorage.getItem("fortis-theme") === "dark" ? "dark" : "light";
        } catch {}
        document.documentElement.lang = language;
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="preload"
      as="image"
      href="/products/naltrexone-1-5.webp"
      fetchpriority="high"
    />
    <meta name="theme-color" content="#123245" />
    <meta
      name="description"
      content="Fortis Pharmaceuticals - individual compounding, a considered approach to preparation, and a focused medicine portfolio. Prepared in Tbilisi, Georgia."
    />
    <title>Fortis Pharmaceuticals - Precision compounding in Tbilisi</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
