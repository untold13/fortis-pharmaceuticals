<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        let theme = "light";
        try {
          theme =
            localStorage.getItem("fortis-theme") === "dark" ? "dark" : "light";
        } catch {}
        document.documentElement.lang = "ka";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fcfaf7" />
    <meta
      name="description"
      content="ფორტის ფარმაცევტიკალსი — ინდივიდუალური კომპოზიტური ფარმაცია და პრეპარატების საინფორმაციო კატალოგი თბილისში."
    />
    <title>ფორტის ფარმაცევტიკალსი — კომპოზიტური ფარმაცია თბილისში</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
